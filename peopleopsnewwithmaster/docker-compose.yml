services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peopleops}
      POSTGRES_USER: ${POSTGRES_USER:-peopleops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - peopleops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peopleops} -d ${POSTGRES_DB:-peopleops}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [app]
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-peopleops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-peopleops}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      BANK_DETAILS_KEY: ${BANK_DETAILS_KEY:?Set BANK_DETAILS_KEY in .env}
      CORS_ORIGIN: http://localhost:8088
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/peopleops-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [app]
  web:
    build:
      context: .
      dockerfile: deployments/Dockerfile.web
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]
volumes:
  peopleops-postgres:
networks:
  app:
